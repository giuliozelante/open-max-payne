[workspace]
resolver = "2"
members = [
  "crates/openras",
  "crates/openpfx",
  "crates/maxfx-patcher",
  "crates/maxfx-play",
  "crates/maxfx-engine",
  "studio/src-tauri",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
