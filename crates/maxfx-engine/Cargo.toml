[package]
name = "maxfx-engine"
version = "0.1.0"
edition = "2021"
description = "Native Max Payne 1 engine walking skeleton (OpenLara-style BYOD) — not playable yet"
license = "MIT OR Apache-2.0"

[[bin]]
name = "maxfx-engine"
path = "src/main.rs"

[lib]
name = "maxfx_engine"
path = "src/lib.rs"

[dependencies]
openras = { path = "../openras" }
openpfx = { path = "../openpfx" }
thiserror = "2"
minifb = "0.28"
jpeg-decoder = "0.3"
wgpu = "30.0.1"
pollster = "1.0.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
winit = "0.30.13"
