[package]
name = "open-max-payne-studio"
version = "0.1.0"
description = "Open Max Payne Studio — native desktop UI"
authors = ["Open Max Payne"]
edition = "2021"

[lib]
name = "studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
openras = { path = "../../crates/openras" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
